name: Scheduled jobs

"on":
  schedule:
    # Lines and grading, hourly.
    - cron: "20 * * * *"
    # Reminders, every morning. The route decides whether today actually has
    # games left to kick off — fixed weekdays broke on weeks like
    # Thanksgiving, which has games Wed, Thu, Fri, Sun and Mon.
    - cron: "30 14,15,16 * * *"
  workflow_dispatch:

jobs:
  # Runs on every trigger.
  lines:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest spread lines
        run: 'curl -sS --fail-with-body -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/ingest"'

      - name: Grade finished games
        run: 'curl -sS --fail-with-body -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/grade"'

  # Only the reminder schedule, never the hourly one.
  remind:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '20 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Send pick reminders
        run: 'curl -sS --fail-with-body -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/remind"'
